
name: Build Activity Explorer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ActivityExplorer.zip"
      - ".github/workflows/build-activity-explorer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          mkdir -p activity-explorer
          unzip -q ActivityExplorer.zip -d activity-explorer
          test -f activity-explorer/settings.gradle.kts

      - name: Compile APK
        working-directory: activity-explorer
        run: gradle assembleDebug --stacktrace

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ActivityExplorer-debug
          path: activity-explorer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
